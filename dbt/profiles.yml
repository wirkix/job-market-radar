# Safe to commit: every value here is env_var()-sourced, nothing hardcoded.
# The docker-compose Airflow containers already have the matching env vars
# via .env, so `dbt build --profiles-dir .` just works inside them.

job_market_radar:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: public
      threads: 4
